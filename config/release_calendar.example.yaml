# EXAMPLE release calendar — copy to release_calendar.yaml and REPLACE with programs YOU
# care about (AGENT_ONBOARDING.md question 3's "thrilled by" list is the right seed).
# Every expected_open is an ESTIMATE that decays; the nightly calendar joint re-researches
# each entry against the web and against real post dates the system itself observes
# (data/observed_opens.jsonl). The digest's pre-network email surfaces entries opening
# within 14 days. The joint refuses to manage a calendar with fewer than 5 entries.
# Dates below were public estimates as of 2026-08; treat them as placeholders, not facts.

- program: "Palantir Internships (Deployment Strategist, Product)"
  company: Palantir
  expected_open: "2026-08-15"
  confidence: medium
  cadence: annual
  terms: [summer]
  deadline_behavior: "rolling until filled; apply in the first 2 weeks"
  requirements: "some seats need work authorization or clearance eligibility"
  evidence: "https://www.palantir.com/careers/"

