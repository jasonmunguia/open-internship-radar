name: apply-log
# Serialises click writes: the Vercel relay only fires an event, this appends the row.
on:
  repository_dispatch:
    types: [radar-click]
permissions:
  contents: write
# NO concurrency group (2026-09-02). GitHub keeps at most ONE pending run per group and
# cancels the older pending run when another dispatch arrives — a burst of taps (a digest
# cleared in ten minutes) lost 16 of 41 on 2026-08-31, before any job started. Serialising
# is unnecessary: data/*.jsonl carry merge=union in .gitattributes, so concurrent appends
# rebase cleanly, and the push loop below absorbs the race instead of dropping the tap.
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main        # dispatch pins github.sha to a stale tip; queued runs must
                           # start from the branch head their predecessor just pushed
      - name: Append click
        env:
          P: ${{ toJSON(github.event.client_payload) }}
        run: |
          mkdir -p data
          python3 - <<'PY'
          import json, os, time
          p = json.loads(os.environ["P"])
          act = p.get("action", "applied")
          row = {"job_id": p.get("job_id",""), "action": act,
                 "ts": int(p.get("ts", time.time()*1000))//1000, "url": p.get("url","")}
          # Verdict taps (👍/👎) are FEEDBACK, not queue state: routed to their own file
          # so a 👎 never masquerades as an application in applied.jsonl.
          dest = "data/feedback.jsonl" if act in ("yes", "no") else "data/applied.jsonl"
          with open(dest,"a") as fh: fh.write(json.dumps(row)+"\n")
          PY
          git config user.name  "internship-radar"
          git config user.email "actions@github.com"
          git add data/applied.jsonl
          if [ -f data/feedback.jsonl ]; then git add data/feedback.jsonl; fi
          git commit -m "click: ${{ github.event.client_payload.action }} [skip ci]" || exit 0
          for i in 1 2 3 4 5 6; do
            git pull --rebase -q && git push -q && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 2 + RANDOM % 3))
          done
          echo "::error::tap NOT persisted after 6 attempts: $P"
          exit 1
