name: poll
on:
  schedule:
    # every 2 hours, skipping the 2-7am PDT quiet window. UTC hours (PDT = UTC-7).
    # Burning alerts fire within one poll cycle (<=2h) — plenty fast for rolling reviews measured in days.
    - cron: "0 0,2,4,6,8,14,16,18,20,22 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
concurrency:
  group: poll
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Guard — US-only location gate must pass
        run: python -m tests.test_location
      - name: Poll sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python -m radar.poll
      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "state: $(date -u +%FT%TZ) [skip ci]"
          git pull --rebase && git push
