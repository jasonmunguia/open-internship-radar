name: poll
on:
  schedule:
    # Every 30 minutes, around the clock (2026-10-27: alerts the moment a role drops).
    # Off the :00 minute on purpose: GitHub delays and drops top-of-hour schedules under load,
    # and in October only 113 of ~270 scheduled 2-hour polls actually ran.
    # Budget: a run under 60s bills 1 minute, so this is ~1,570 min/month on a private repo,
    # inside GitHub Free's 2,000. Pro (3,000) affords every 20 min: "7,27,47 * * * *".
    - cron: "7,37 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
concurrency:
  group: poll
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Guard — US-only location gate must pass
        run: python -m tests.test_location
      - name: Guard — intern gate must not match "international"
        run: python -m tests.test_gate_patterns
      - name: Poll sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: |
          # The UNCONFIGURED template repo must skip green, not fail red every 2 hours
          # and email the owner (observed 2026-08-10). Forks activate by committing the
          # real configs per SETUP.md; person.yaml stays private via .gitignore.
          if [ ! -f config/profile.yaml ]; then
            echo "No config/profile.yaml - unconfigured template. Copy config/*.example.yaml to activate (SETUP.md). Skipping."
            exit 0
          fi
          python -m radar.poll
      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # seen.json is a key set two machines write; the driver merges it as a union so a
          # concurrent Mac push can't fail this push and drop the alert keys just recorded.
          git config merge.seen.driver "python3 -m radar.merge_seen %O %A %B"
          git add data/
          git diff --cached --quiet || git commit -m "state: $(date -u +%FT%TZ) [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::state push failed 5x; alert keys from this run are not saved"
          exit 1
